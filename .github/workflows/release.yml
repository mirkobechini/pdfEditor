name: Build & Release Desktop App

on:
  push:
    tags:
      - "v*" # e.g. v0.1.0, v0.2.0

permissions:
  contents: read

jobs:
  wait-for-ci:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI on main to pass
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Disable set -e so we don't exit on API transient errors
          set +e
          # Get the commit SHA of what's currently on main
          SHA=$(gh api repos/${REPO}/git/refs/heads/main --jq '.object.sha' 2>/dev/null)
          if [ -z "$SHA" ]; then
            echo "Failed to get main SHA, proceeding anyway."
            exit 0
          fi
          echo "Waiting for CI checks on main (commit: $SHA)..."
          for i in $(seq 1 30); do
            RESULT=$(gh api repos/${REPO}/commits/${SHA}/check-runs --jq '[.check_runs[] | select(.name == "backend" or .name == "frontend") | .conclusion // "pending"] | join(",")' 2>/dev/null)
            echo "  iteration $i: backend+frontend conclusions: $RESULT"
            # Check for failure
            if echo "$RESULT" | grep -q "failure"; then
              echo "CI failed on main, aborting release."
              exit 1
            fi
            # Both success? Good to go
            if echo "$RESULT" | grep -q "success,success"; then
              echo "CI passed on main, proceeding with build."
              exit 0
            fi
            sleep 30
          done
          echo "Timeout waiting for CI on main (15 minutes). Proceeding anyway."
          exit 0

  preflight:
    needs: [wait-for-ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preflight — frontend npm ci
        run: |
          cd frontend
          npm ci
        shell: bash

      - name: Preflight — desktop frontend npm ci
        run: |
          cd desktop/frontend
          npm ci
        shell: bash

      - name: Preflight — desktop frontend build (static export)
        run: |
          cd desktop/frontend
          npm run build
        shell: bash

      - name: Preflight — backend pip deps
        run: |
          cd backend
          pip install -r requirements.txt
        shell: bash

      - name: Preflight — backend imports (sidecar entry)
        run: |
          cd desktop
          pip install -r ../backend/requirements.txt pyinstaller
          python -c "
            import sys
            sys.path.insert(0, '../backend')
            from app.core.config import Settings
            s = Settings()
            print(f'Settings OK: APP_NAME={s.APP_NAME}')
            import app.main
            import app.core.database
            import app.models
            import app.repositories
            import app.services
            import app.api.v1
            import uvicorn
            print('All sidecar imports OK')
            "
        shell: bash

  build:
    needs: [preflight]
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Bump version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Bumping version to $VERSION"
          # Use python3 for portable sed-like replacement (works on macOS, Linux, Windows)
          python3 -c "
          import json, re
          # tauri.conf.json
          with open('desktop/src-tauri/tauri.conf.json') as f:
              c = json.load(f)
          c['version'] = '$VERSION'
          with open('desktop/src-tauri/tauri.conf.json', 'w') as f:
              json.dump(c, f, indent=2)
          # package.json
          with open('frontend/package.json') as f:
              c = json.load(f)
          c['version'] = '$VERSION'
          with open('frontend/package.json', 'w') as f:
              json.dump(c, f, indent=2)
          # pyproject.toml
          with open('backend/pyproject.toml') as f:
              content = f.read()
          content = re.sub(r'^version = \".*\"', 'version = \"$VERSION\"', content, flags=re.MULTILINE)
          with open('backend/pyproject.toml', 'w') as f:
              f.write(content)
          "
          echo "Version bumped to $VERSION in all config files"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install desktop frontend dependencies
        run: |
          cd desktop/frontend
          npm ci

      - name: Install backend dependencies (for sidecar)
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            x86_64-pc-windows-msvc
            aarch64-apple-darwin
            x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"

      - name: Cache npm (frontend)
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-frontend-${{ hashFiles('frontend/package-lock.json') }}

      - name: Cache npm (desktop frontend)
        uses: actions/cache@v4
        with:
          path: desktop/frontend/node_modules
          key: ${{ runner.os }}-npm-desktop-${{ hashFiles('desktop/frontend/package-lock.json') }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Tauri CLI
        run: |
          cargo install cargo-binstall
          cargo binstall -y tauri-cli@^2

      - name: Build sidecar
        shell: bash
        run: |
          cd desktop
          pip install pyinstaller
          bash build-sidecar.sh

      - name: Rename sidecar for Tauri target triple
        shell: bash
        run: |
          # Detect host target triple dynamically (macOS runners alternate between Intel and ARM)
          TRIPLE=$(rustc -vV | grep "^host:" | awk '{print $2}')
          SIDECAR="desktop/src-tauri/binaries/fastapi-sidecar"
          EXT=""
          case "$TRIPLE" in
            *windows*|*msvc*) EXT=".exe" ;;
          esac
          if [ -f "${SIDECAR}${EXT}" ]; then
            mv "${SIDECAR}${EXT}" "${SIDECAR}-${TRIPLE}${EXT}"
            echo "Renamed sidecar to fastapi-sidecar-${TRIPLE}${EXT}"
          else
            echo "Warning: ${SIDECAR}${EXT} not found, skipping rename"
            ls -la "$(dirname "$SIDECAR")" || true
          fi

      - name: Build Tauri app
        # Per firma degli aggiornamenti, impostare in GitHub → Settings → Secrets:
        #   TAURI_PRIVATE_KEY (generata con: cargo tauri signer generate)
        #   TAURI_KEY_PASSWORD
        run: |
          cd desktop/src-tauri
          cargo tauri build --ci

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdfeditor-${{ runner.os }}
          path: |
            desktop/src-tauri/target/release/bundle/
            !desktop/src-tauri/target/release/bundle/**/*.pdb

  create-release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pdfeditor-*
          merge-multiple: true

      - name: Generate release notes
        id: notes
        run: |
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "## PdfEditor Desktop App" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "See [CHANGELOG.md](./CHANGELOG.md) for details." >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "PdfEditor ${{ github.ref_name }}"
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: false
          files: |
            **/*.msi
            **/*.dmg
            **/*.AppImage
            **/*.deb
