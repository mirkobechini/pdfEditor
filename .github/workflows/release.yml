name: Build & Release Desktop App

on:
  push:
    tags:
      - "v*" # e.g. v0.1.0, v0.2.0

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install backend dependencies (for sidecar)
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            x86_64-pc-windows-msvc
            aarch64-apple-darwin
            x86_64-unknown-linux-gnu

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build sidecar
        shell: bash
        run: |
          cd desktop
          pip install pyinstaller
          bash build-sidecar.sh

      - name: Rename sidecar for Tauri target triple
        shell: bash
        run: |
          SIDECAR="desktop/src-tauri/binaries/fastapi-sidecar"
          TRIPLE="${{ matrix.os == 'windows-latest' && 'x86_64-pc-windows-msvc' || matrix.os == 'macos-latest' && 'aarch64-apple-darwin' || 'x86_64-unknown-linux-gnu' }}"
          EXT="${{ matrix.os == 'windows-latest' && '.exe' || '' }}"
          if [ -f "${SIDECAR}${EXT}" ]; then
            mv "${SIDECAR}${EXT}" "${SIDECAR}-${TRIPLE}${EXT}"
            echo "Renamed sidecar to fastapi-sidecar-${TRIPLE}${EXT}"
          fi

      - name: Build Tauri app
        # Per firma degli aggiornamenti, impostare in GitHub → Settings → Secrets:
        #   TAURI_PRIVATE_KEY (generata con: cargo tauri signer generate)
        #   TAURI_KEY_PASSWORD
        run: |
          cd desktop/src-tauri
          cargo tauri build --ci

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdfeditor-${{ runner.os }}
          path: |
            desktop/src-tauri/target/release/bundle/
            !desktop/src-tauri/target/release/bundle/**/*.pdb

  create-release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pdfeditor-*
          merge-multiple: true

      - name: Generate release notes
        id: notes
        run: |
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "## PdfEditor Desktop App" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "See [CHANGELOG.md](./CHANGELOG.md) for details." >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "PdfEditor ${{ github.ref_name }}"
          body: ${{ steps.notes.outputs.notes }}
          draft: true
          prerelease: false
          files: |
            **/*.msi
            **/*.dmg
            **/*.AppImage
            **/*.deb
