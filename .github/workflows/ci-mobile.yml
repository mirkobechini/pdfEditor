name: Mobile CI

on:
  push:
    branches: [dev, main]
    paths:
      - "mobile/**"
  pull_request:
    branches: [dev, main]
    paths:
      - "mobile/**"

permissions:
  contents: read

jobs:
  mobile-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Run tests
        run: npm test

  e2e-mobile:
    # E2E mobile (issue #919 perimetro 1 → #923 perimetro 2): suite Maestro su
    # emulatore Android con BACKEND LOCALE (opzione 2, decisa da Mirko 04/10).
    # Il job avvia un FastAPI+SQLite su localhost:8000 e l'APK (buildato con
    # EXPO_PUBLIC_API_URL=http://10.0.2.2:8000) parla con l'host dell'emulatore:
    # suite COMPLETA a ogni push, zero servizi esterni, mai produzione.
    # Ottimizzazione 05/10 (issue #923): l'APK viene CACHED per hash delle
    # sorgenti app (src/, config, package-lock) — i flow .maestro NON cambiano
    # l'APK, quindi la build EAS (il collo di bottiglia, coda free tier) viene
    # saltata quando il codice app non è cambiato.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "mobile/package-lock.json"

      - name: Install mobile dependencies
        run: cd mobile && npm ci

      - name: Setup Java (build APK locale)
        # Build locale dell'APK sul runner GitHub (JDK + Android SDK preinstallati):
        # niente EAS nel percorso di test -> niente coda free tier (fix 05/10, issue #923).
        # NB: setup-java ha versioni proprie (v4), non v7 come checkout/setup-node.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compute APK cache key
        id: apk-key
        run: |
          KEY="pm-apk-${{ hashFiles('mobile/src/**', 'mobile/assets/**', 'mobile/app.json', 'mobile/app.config.js', 'mobile/eas.json', 'mobile/package.json', 'mobile/package-lock.json', 'mobile/index.ts', 'mobile/App.tsx', 'mobile/tsconfig.json', 'mobile/babel.config.js', 'mobile/metro.config.js', 'mobile/.easignore') }}"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "APK cache key: $KEY"

      - name: Restore APK from cache
        id: apk-cache
        uses: actions/cache@v4
        with:
          path: mobile/pdfeditor-e2e.apk
          key: ${{ steps.apk-key.outputs.key }}
          restore-keys: |
            pm-apk-

      - name: Build APK locally (no EAS)
        if: steps.apk-cache.outputs.cache-hit != 'true'
        env:
          EXPO_PUBLIC_API_URL: http://10.0.2.2:8000
        run: |
          cd mobile
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew :app:assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../pdfeditor-e2e.apk
          ls -la ../pdfeditor-e2e.apk

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        run: pip install -r backend/requirements.txt

      - name: Start local test backend
        # T0-backend (#923, opzione 2): il job avvia il backend FastAPI locale
        # con SQLite (pattern identico alla e2e web). L'emulatore Android lo
        # raggiunge su 10.0.2.2:8000 (loopback host). Zero servizi esterni,
        # mai il DB di produzione. DEBUG=true rilassa i cookie (secure=False),
        # ENVIRONMENT=development tiene spenta la guardia anti-test (#921).
        run: |
          cd backend
          DATABASE_URL=sqlite:///./e2e_mobile_test.db \
          DEBUG=true DISABLE_LICENSE_ENFORCEMENT=true \
          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 \
            > /tmp/e2e-backend.log 2>&1 &
          echo $! > /tmp/e2e-backend.pid
          # Attesa health check (max 60s)
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "Backend di test pronto (iterazione $i)"
              exit 0
            fi
            sleep 2
          done
          echo "Backend di test NON raggiungibile dopo 60s:"
          tail -40 /tmp/e2e-backend.log
          exit 1

      - name: Enable KVM group perms
        # fix(issue #919): senza KVM l'emulatore gira a -accel off (software):
        # boot 347s + adb install 310s e il primo render dell'app non arriva
        # entro il timeout di 300s. Il runner GitHub espone /dev/kvm ma senza
        # permessi per l'utente; la regola udev li abilita.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro E2E on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          profile: pixel_4
          cores: 4
          working-directory: mobile
          script: |
            # L'action reactivecircus/android-emulator-runner esegue ogni riga
            # come sh -c separato: niente export che persiste tra righe.
            # NB: lo script gira con bash -e: una failure di maestro test
            # interrompeva lo script PRIMA della cattura diagnostica.
            # -> set +e attorno al test e cattura SEMPRE su failure.
            curl -Ls "https://get.maestro.mobile.dev" | bash
            M="$HOME/.maestro/bin/maestro" && "$M" --version && adb install pdfeditor-e2e.apk
            # T1/T4 perimetro 2 (issue #923): gli asset PDF di test servono ai
            # flussi upload-viewer, merge e split (selezione dal picker di sistema).
            adb push .maestro/assets/e2e-upload.pdf /sdcard/Download/e2e-upload.pdf || echo "push asset PDF: fallito (skip)"
            adb push .maestro/assets/e2e-merge.pdf /sdcard/Download/e2e-merge.pdf || echo "push asset merge PDF: fallito (skip)"
            # Emulatore software lento -> possibili dialog ANR/SystemUI a
            # schermo che coprono l'app e fanno fallire gli assert. Nascondili.
            adb shell settings put global hide_error_dialogs 1 || true
            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell wm dismiss-keyguard || true
            # T0-backend (#923): il backend locale è già attivo sul runner
            # (uvicorn su 10.0.2.2:8000 raggiungibile dall'emulatore), quindi
            # la suite COMPLETA gira sempre a ogni push. Mai produzione.
            set +e
            echo "Eseguo la suite completa (backend locale)"
            "$HOME/.maestro/bin/maestro" test .maestro --format junit --output e2e-results.xml
            EC=$?
            set -e
            echo "Maestro exit code: $EC"
            if [ $EC -ne 0 ]; then echo "Cattura diagnostica emulatore (screenshot+UI+logcat)…"; adb exec-out screencap -p > e2e-screen.png 2>/dev/null || true; adb shell uiautomator dump /sdcard/e2e-ui.xml >/dev/null 2>&1 && adb pull /sdcard/e2e-ui.xml >/dev/null 2>&1 || true; adb logcat -d -t 300 > e2e-logcat.txt 2>/dev/null || true; fi
            exit $EC

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-mobile-results
          path: mobile/e2e-*
          retention-days: 7
