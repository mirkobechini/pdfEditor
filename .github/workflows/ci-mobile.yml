name: Mobile CI

on:
  push:
    branches: [dev, main]
    paths:
      - "mobile/**"
  pull_request:
    branches: [dev, main]
    paths:
      - "mobile/**"

permissions:
  contents: read

jobs:
  mobile-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
