name: Keep Warm Backend

on:
  schedule:
    # Ogni 14 minuti — mantiene Render attivo (sleep threshold = 15min)
    # senza esaurire le compute hours di Neon (100h/mese free tier)
    # Limitato a 9-12 e 15-21 ora Italia (CEST=UTC+2) per non consumare
    # le ore-istanza Render nelle fasce morte. Da aggiustare di 1h quando
    # finisce l'ora legale (fine ottobre, torna CET=UTC+1).
    - cron: "*/14 7-9 * * *"
    - cron: "*/14 13-18 * * *"
  workflow_dispatch: # Permette esecuzione manuale

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      - name: Ping /health
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://pdfeditor-api.mirkobechini.com/health
