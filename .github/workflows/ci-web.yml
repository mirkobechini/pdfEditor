name: Web CI

on:
  push:
    branches: [dev, main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "shared/**"
      - ".github/workflows/ci-web.yml"
  pull_request:
    branches: [dev, main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "shared/**"
      - ".github/workflows/ci-web.yml"

permissions:
  contents: read

# node24 env

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests with coverage
        run: PYTHONPATH=. pytest tests/ --cov=app --cov-report=term --cov-report=xml -q
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: backend/coverage.xml
          flags: backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npx vitest run --reporter=verbose
      - name: Build check (catch compilation errors)
        run: npm run build
      - name: Run coverage
        run: npx vitest run --coverage --reporter=verbose 2>&1 | tail -10
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
