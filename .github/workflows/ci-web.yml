name: Web CI

on:
  push:
    branches: [dev, main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "shared/**"
      - "e2e/**"
      - ".github/workflows/ci-web.yml"
  pull_request:
    branches: [dev, main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "shared/**"
      - "e2e/**"
      - ".github/workflows/ci-web.yml"

permissions:
  contents: read

# node24 env

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests with coverage
        run: PYTHONPATH=. pytest tests/ --cov=app --cov-report=term --cov-report=xml -q
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: backend/coverage.xml
          flags: backend

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Copy shared (prebuild)
        run: node scripts/copy-shared.js
      - name: Check shared sync (Tranche 1, #908)
        run: node ../scripts/check-shared-sync.js
      - name: Run tests
        run: npx vitest run --reporter=verbose
      - name: Build check (catch compilation errors)
        run: npm run build
        # resolveBaseUrl (issue #884 A2) fail-fast: a production build without the
        # base-URL env vars intentionally aborts. Give the compile check dummy
        # values so CI stays green; real values are set on Render (sync:false).
        env:
          NEXT_PUBLIC_API_URL: "https://pdfeditor-api.mirkobechini.com"
          NEXT_PUBLIC_DOCUMENTS_API_URL: "https://pdfeditor-api.mirkobechini.com"
      - name: Run coverage
        run: npx vitest run --coverage --reporter=verbose 2>&1 | tail -10
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: frontend/coverage/lcov.info
          flags: frontend

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: e2e/package-lock.json
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Install frontend deps
        run: cd frontend && npm ci
      - name: Install e2e deps
        run: cd e2e && npm ci
      - name: Install Playwright browsers
        run: cd e2e && npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: cd e2e && PYTHON=python npx playwright test --reporter=line
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  e2e-desktop:
    # E2E desktop (Sidecar/API-first, issue #917): testa il backend FastAPI in
    # modalita' SQLite locale (config del sidecar) senza la UI/dialoghi nativi.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "npm"
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Install e2e-desktop deps
        run: cd e2e-desktop && npm ci
      - name: Run E2E desktop tests
        run: cd e2e-desktop && PYTHON=python npx playwright test --reporter=line
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-e2e-desktop
          path: e2e-desktop/playwright-report/
          retention-days: 7
