name: Desktop CI

on:
  workflow_dispatch:
  push:
    branches: [dev, main]
    paths:
      - "desktop/**"
      - "shared/**"
  pull_request:
    branches: [dev, main]
    paths:
      - "desktop/**"
      - "shared/**"

permissions:
  contents: read

jobs:
  desktop-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Copy shared source
        run: node scripts/copy-shared.js
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npx vitest run --reporter=verbose
      - name: Build check (catch compilation errors)
        run: npm run build
      - name: Run coverage
        run: npx vitest run --coverage --reporter=verbose 2>&1 | tail -10
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: desktop/frontend/coverage/lcov.info
          flags: desktop
