name: Desktop CI

on:
  workflow_dispatch:
  push:
    branches: [dev, main]
    paths:
      - "desktop/**"
      - "shared/**"
      - "backend/**"
  pull_request:
    branches: [dev, main]
    paths:
      - "desktop/**"
      - "shared/**"
      - "backend/**"

permissions:
  contents: read

jobs:
  desktop-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Copy shared source
        run: node scripts/copy-shared.js
      - name: Check shared sync (Tranche 1, #908)
        run: node ../../scripts/check-shared-sync.js
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npx vitest run --reporter=verbose
      - name: Build check (catch compilation errors)
        run: npm run build
      - name: Run coverage
        run: npx vitest run --coverage --reporter=verbose 2>&1 | tail -10
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: desktop/frontend/coverage/lcov.info
          flags: desktop

  # Deep agent #932 — E2E con provider REALE (Ollama). Il deep agent è il
  # sidecar del desktop, quindi vive qui. Test in tests/integration_tests/
  # marcati @pytest.mark.integration; se Ollama non è raggiungibile SKIPPANO
  # (autoskip nel file), quindi non rompono mai la CI.
  deep-agent-e2e:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: pip install -r requirements.txt
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Pull tiny model (solo per il flusso, non la qualità)
        run: ollama pull qwen3:0.6b
      - name: Run deep-agent E2E (integration)
        env:
          PDFMIND_OLLAMA_URL: http://127.0.0.1:11434
          PDFMIND_WORKSPACE: /tmp/pdfmind-e2e
        run: PYTHONPATH=. pytest tests/integration_tests -m integration -q
