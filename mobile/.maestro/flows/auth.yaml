appId: com.mirkobechini.pdfeditor
name: PdfEditor Mobile
---
# Tranche 3 — flusso auth: registrazione utente e2e → home con lista vuota.
# (perimetro 1, issue #919). Email univoca per esecuzione.
- evalScript: ${output = { email: "e2e_" + Date.now() + "@test.com" }}
- launchApp
- extendedWaitUntil:
    visible: "Salta|Email"
    timeout: 20000
- runFlow:
    when:
      visible: "Salta"
    commands:
      - tapOn: "Salta"
      - extendedWaitUntil:
          visible: "Email|Continua come Ospite"
          timeout: 10000
# Passo al modulo Registrazione
- tapOn: "Non hai un account? Registrati"
- assertVisible: "Nome Completo"
# Compila i campi
- tapOn: "Nome Completo"
- inputText: "E2E Mobile User"
- hideKeyboard
- tapOn: "Email"
- eraseText
- inputText: ${output.email}
- hideKeyboard
- tapOn: "Password"
- eraseText
- inputText: "Password123"
- hideKeyboard
# Invia
- tapOn: "Registrati"
# Attesa home con lista vuota
- extendedWaitUntil:
    visible: "Nessun PDF|Editor"
    timeout: 30000
- assertVisible: "Nessun PDF"