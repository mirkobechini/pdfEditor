appId: com.mirkobechini.pdfeditor
name: PdfEditor Mobile
---
# T6 perimetro 2 (issue #923): OCR su un PDF dal flusso Tools.
# OCR è cloud-only (backend Tesseract) -> con il backend locale di CI (T0)
# funziona normalmente. Successo = dialogo "Rename PDF" si apre dopo il Run
# (handleOcrDone -> openRenameDialog).

- launchApp:
    clearState: true
# Onboarding (prima installazione): skip se presente
- extendedWaitUntil:
    visible: "Salta|Skip|Continue as Guest|Continua come Ospite|Email"
    timeout: 120000
- runFlow:
    when:
      visible: "Salta|Skip"
    commands:
      - tapOn: "Salta|Skip"
      - extendedWaitUntil:
          visible: "Continue as Guest|Continua come Ospite|Email"
          timeout: 30000
# Sessione: login come ospite
- tapOn: "Continue as Guest|Continua come Ospite"
- extendedWaitUntil:
    visible: "fab-add-pdf|Add PDF|Upload from device"
    timeout: 120000
# Upload del PDF di test
- tapOn:
    id: "fab-add-pdf"
- extendedWaitUntil:
    visible: "Upload from device|Carica dal dispositivo"
    timeout: 10000
- tapOn: "Upload from device|Carica dal dispositivo"
- extendedWaitUntil:
    visible: "Show roots|Downloads|e2e-upload.pdf"
    timeout: 20000
- runFlow:
    when:
      visible: "Show roots"
    commands:
      - tapOn: "Show roots"
      - extendedWaitUntil:
          visible: "Downloads"
          timeout: 10000
      - tapOn: "Downloads"
- extendedWaitUntil:
    visible: "e2e-upload.pdf"
    timeout: 20000
- tapOn: "e2e-upload.pdf"
- runFlow:
    when:
      visible: "Sync to cloud?"
    commands:
      - tapOn: "No"
- extendedWaitUntil:
    visible: "1 / 1"
    timeout: 90000
- back
- extendedWaitUntil:
    visible: "tools-button|fab-add-pdf|Add PDF"
    timeout: 30000

# ─── Tools → OCR ───
- tapOn:
    id: "tools-button"
- extendedWaitUntil:
    visible: "PDF Tools|OCR"
    timeout: 20000
- tapOn:
    id: "tool-ocr"
- extendedWaitUntil:
    visible: "e2e-upload.pdf"
    timeout: 20000
- tapOn: "e2e-upload.pdf"
# Dialog "OCR PDF" con lingua default (English)
- extendedWaitUntil:
    visible: "OCR PDF"
    timeout: 20000
- assertVisible: "English"
# Avvia il riconoscimento
- tapOn: "Run OCR"
# Attesa: "Recognizing text..." poi successo -> rename dialog
- extendedWaitUntil:
    visible: "Rename PDF"
    timeout: 120000
- tapOn: "Cancel|Annulla"