appId: com.mirkobechini.pdfeditor
name: PdfEditor Mobile
---
# T5 perimetro 2 (issue #923): protezione con password + unlock di un PDF.
# Flusso: upload → Tools → Protect (password) → protected_*.pdf in lista
# → Unlock (stessa password) → unlocked_*.pdf in lista.

- launchApp:
    clearState: true
# Onboarding (prima installazione): skip se presente
- extendedWaitUntil:
    visible: "Salta|Skip|Continue as Guest|Continua come Ospite|Email"
    timeout: 120000
- runFlow:
    when:
      visible: "Salta|Skip"
    commands:
      - tapOn: "Salta|Skip"
      - extendedWaitUntil:
          visible: "Continue as Guest|Continua come Ospite|Email"
          timeout: 30000
# Sessione: login come ospite
- tapOn: "Continue as Guest|Continua come Ospite"
- extendedWaitUntil:
    visible: "fab-add-pdf|Add PDF|Upload from device"
    timeout: 120000
# Upload del PDF di test
- tapOn:
    id: "fab-add-pdf"
- extendedWaitUntil:
    visible: "Upload from device|Carica dal dispositivo"
    timeout: 10000
- tapOn: "Upload from device|Carica dal dispositivo"
- extendedWaitUntil:
    visible: "Show roots|Downloads|e2e-upload.pdf"
    timeout: 20000
- runFlow:
    when:
      visible: "Show roots"
    commands:
      - tapOn: "Show roots"
      - extendedWaitUntil:
          visible: "Downloads"
          timeout: 10000
      - tapOn: "Downloads"
- extendedWaitUntil:
    visible: "e2e-upload.pdf"
    timeout: 20000
- tapOn: "e2e-upload.pdf"
- runFlow:
    when:
      visible: "Sync to cloud?"
    commands:
      - tapOn: "No"
- extendedWaitUntil:
    visible: "1 / 1"
    timeout: 90000
- back
- extendedWaitUntil:
    visible: "tools-button|fab-add-pdf|Add PDF"
    timeout: 30000

# ─── Tools → Protect ───
- tapOn:
    id: "tools-button"
- extendedWaitUntil:
    visible: "PDF Tools|Password"
    timeout: 20000
- tapOn:
    id: "tool-protect"
- extendedWaitUntil:
    visible: "e2e-upload.pdf"
    timeout: 20000
- tapOn: "e2e-upload.pdf"
# Dialog "Set Password"
- extendedWaitUntil:
    visible: "Set Password"
    timeout: 20000
# Compila i campi password + conferma
- tapOn:
    id: "password-input"
- inputText: "E2ePass123"
- hideKeyboard
- tapOn:
    id: "password-confirm-input"
- inputText: "E2ePass123"
- hideKeyboard
- tapOn:
    id: "password-submit"
# Successo: snackbar "Protected: ..." + file protected_* in lista
- extendedWaitUntil:
    visible: "protected_.*"
    timeout: 60000
- assertVisible: "protected_.*"

# ─── Tools → Unlock (sullo stesso PDF protetto) ───
- tapOn:
    id: "tool-unlock"
- extendedWaitUntil:
    visible: "protected_.*"
    timeout: 20000
- tapOn: "protected_.*"
# Dialog "Unlock PDF"
- extendedWaitUntil:
    visible: "Unlock PDF"
    timeout: 20000
- tapOn:
    id: "password-input"
- inputText: "E2ePass123"
- hideKeyboard
- tapOn:
    id: "password-submit"
# Successo: snackbar "Unlocked: ..." + file unlocked_* in lista
- extendedWaitUntil:
    visible: "unlocked_.*"
    timeout: 60000
- assertVisible: "unlocked_.*"