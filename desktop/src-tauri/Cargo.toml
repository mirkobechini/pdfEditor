[package]
name = "pdf-editor-desktop"
version = "0.1.0"
description = "PdfEditor - Desktop App"
authors = ["Mirko Bechini"]
edition = "2021"

[package.metadata]
"dist" = "../../frontend/out"

[package.metadata.tauri-winres]
"icon" = "icons/icon.ico"

[package.metadata.tauri]
"frontendDist" = "../../frontend/out"

[lib]
name = "pdf_editor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tauri-build = "2"

